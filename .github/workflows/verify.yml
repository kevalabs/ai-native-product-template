name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  issues: read
  pull-requests: read
  checks: read

jobs:
  template:
    name: Template verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: make test

  sdlc:
    name: SDLC history
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate every PR commit
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BRANCH: ${{ github.head_ref }}
        run: >-
          python3 scripts/check_sdlc.py
          --base "$PR_BASE" --head "$PR_HEAD" --branch "$PR_BRANCH"

      - name: Verify predecessor merges and artifact links
        env:
          GH_TOKEN: ${{ github.token }}
          PR_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BRANCH: ${{ github.head_ref }}
        run: >-
          python3 scripts/check_github.py --repo "$PR_REPO" --pr "$PR_NUMBER"
          --base "$PR_BASE" --head "$PR_HEAD" --branch "$PR_BRANCH"
