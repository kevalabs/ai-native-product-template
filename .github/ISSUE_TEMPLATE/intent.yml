    id: record
    attributes:
      label: Outcome record
      description: Fill the headers and link the governing Markdown. Keep full requirements in that artifact.
      value: |
        **Outcome:** <NNN-name>
        **Status:** Proposed
        **Artifact:** <readable intent.md URL>

        ## Artifact index
        <Links to the stage artifacts as they become available.>
    validations:
      required: true
